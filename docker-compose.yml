# Local development services for multicode-ai.
#
#   docker compose up -d      start everything
#   npm run db:migrate        apply the schema (not run automatically — see below)
#   docker compose down       stop, keeping data
#   docker compose down -v    stop and wipe the volumes
#
# Credentials here are development defaults, committed on purpose so the stack
# comes up with no setup. Override any of them with a .env file beside this one,
# and never reuse them anywhere reachable from outside your machine.

# Deliberately not renamed with the product. Compose prefixes volume names with
# the project name, so changing it would orphan every existing local database,
# workspace and Redis volume rather than migrate them.
name: multiplayer-ai

x-team-context: &team-context
  INTEGRATIONS_PUBLIC_URL: ${INTEGRATIONS_PUBLIC_URL:-}
  INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  TEAM_CONTEXT_BACKEND: ${TEAM_CONTEXT_BACKEND:-postgres}
  TEAM_CONTEXT_RETENTION_DAYS: ${TEAM_CONTEXT_RETENTION_DAYS:-30}

services:
  postgres:
    # 18 specifically: the schema uses uuidv7() for time-ordered primary keys,
    # which older servers do not have. Migration 001 falls back to random v4,
    # so an older tag works — it just loses the index locality.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: multiplayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multiplayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-multiplayer_ai}
      # Faster startup; irrelevant for a throwaway dev database.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 changed this: the mount goes at /var/lib/postgresql, not
      # .../data. The server puts its cluster in a version-named subdirectory,
      # which is what lets `pg_upgrade --link` work across a major version
      # without tripping over the mount boundary. Mounting the old path makes
      # 18 refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Both flags matter: without -d it checks the wrong database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiplayer} -d ${POSTGRES_DB:-multiplayer_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: multiplayer-redis
    restart: unless-stopped
    # No persistence, and no volume. Presence is disposable by design: an empty
    # store after a restart is the correct state, because nobody is connected.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 6380 on the host, not 6379: you already run Redis for another project
      # on the default port. Inside the compose network this is still 6379.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  repo-embeddings:
    image: ${REPO_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "127.0.0.1:${REPO_EMBEDDING_PORT:-11435}:11434"
    volumes:
      - repo-embedding-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  repo-embedding-model:
    image: ${REPO_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: on-failure
    depends_on:
      repo-embeddings:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://repo-embeddings:11434
    # One-time, cached download. No paid API or credentials required.
    command: ["pull", "${REPO_LOCAL_EMBEDDING_MODEL:-nomic-embed-text:v1.5}"]

  # ── Containerized app (staging / production topology) ────────────────────
  # `web` and `worker` sit behind the `app` profile, so a plain
  # `docker compose up` still starts only the backing services that host-based
  # development (./start.sh) uses. Bring the whole app up in containers with:
  #
  #     docker compose --profile app up --build
  #
  # then open http://localhost:3000 and pair each user's local runner.
  # Coding agents run on that user's machine with their own provider login.
  #
  # The heart of this setup is ONE named volume (workspace_data) mounted at the
  # SAME absolute path (/app/workspaces) in BOTH containers. That is what makes
  # repository indexing and web operations see the same Git state — and, because neither
  # container touches a host path, it eliminates the git absolute-gitdir
  # path-identity problem that a host bind mount would have imposed.
  #
  # No operator AI login is mounted. The worker handles repository and memory
  # indexing only. Redis/Postgres use their compose network names.
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: multiplayer-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3000}
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      # Require the caller's paired runner; disable both hosted execution paths.
      <<: *team-context
      LOCAL_RUNNERS: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      AGENT_WORKER: "0"
      MULTIPLAYER_AI_TERMINAL: "0"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-multiplayer}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-multiplayer_ai}
      REPO_EMBEDDING_URL: ${REPO_EMBEDDING_CONTAINER_URL-http://repo-embeddings:11434/v1/embeddings}
      REPO_EMBEDDING_MODEL: ${REPO_EMBEDDING_MODEL-nomic-embed-text:v1.5}
      REPO_EMBEDDING_DIMENSIONS: ${REPO_EMBEDDING_DIMENSIONS:-768}
      REPO_EMBEDDING_API_KEY: ${REPO_EMBEDDING_API_KEY:-}
      REPO_EMBEDDING_QUERY_PREFIX:
      REPO_EMBEDDING_DOCUMENT_PREFIX:
      MNEMOSYNE_URL: http://mnemosyne:8787/mcp
      MNEMOSYNE_MCP_TOKEN: ${MNEMOSYNE_MCP_TOKEN:-localdev-memory-token}
      MULTIPLAYER_AI_DATA: /app/workspaces
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - workspace_data:/app/workspaces

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: multiplayer-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Keep background indexing running without consuming agent-run jobs.
      <<: *team-context
      AGENT_WORKER: "0"
      MULTIPLAYER_AI_TERMINAL: "0"
      REPO_EMBEDDING_QUERY_PREFIX:
      REPO_EMBEDDING_DOCUMENT_PREFIX:
      REPO_EMBEDDING_URL: ${REPO_EMBEDDING_CONTAINER_URL-http://repo-embeddings:11434/v1/embeddings}
      REPO_EMBEDDING_MODEL: ${REPO_EMBEDDING_MODEL-nomic-embed-text:v1.5}
      REPO_EMBEDDING_DIMENSIONS: ${REPO_EMBEDDING_DIMENSIONS:-768}
      REPO_EMBEDDING_API_KEY: ${REPO_EMBEDDING_API_KEY:-}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-multiplayer}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-multiplayer_ai}
      MNEMOSYNE_URL: http://mnemosyne:8787/mcp
      MNEMOSYNE_MCP_TOKEN: ${MNEMOSYNE_MCP_TOKEN:-localdev-memory-token}
      MULTIPLAYER_AI_DATA: /app/workspaces
      # Optional extraction into reviewable proposals. Postgres owns the jobs.
      MEMORY_EXTRACTION_URL: ${MEMORY_EXTRACTION_URL:-}
      MEMORY_EXTRACTION_MODEL: ${MEMORY_EXTRACTION_MODEL:-}
      MEMORY_EXTRACTION_API_KEY: ${MEMORY_EXTRACTION_API_KEY:-}
    volumes:
      # The same named volume at the same path as `web` — the whole point.
      - workspace_data:/app/workspaces

  litellm:
    # Optional chat-completions adapter for proposed memory extraction.
    # Configure the worker's MEMORY_EXTRACTION_URL to point here to use it.
    profiles: ["memory-extraction"]
    image: ghcr.io/berriai/litellm:main-latest
    container_name: multiplayer-litellm
    restart: unless-stopped
    environment:
      # Required for Claude extraction; left soft so `docker compose config`
      # still validates without it. Set it in .env before bringing the app up.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  mnemosyne:
    # The semantic shared-memory sidecar. The app talks to it over MCP
    # streamable HTTP (see app/lib/ai/mnemosyne.ts); when this service is not
    # running, Postgres keyword recall works and indexing jobs wait for recovery.
    build:
      context: .
      dockerfile: docker/mnemosyne/Dockerfile
    container_name: multiplayer-mnemosyne
    restart: unless-stopped
    environment:
      # A non-loopback bind fail-closes without both of these. The token is a
      # committed dev default — override it, and never expose this port publicly.
      MNEMOSYNE_MCP_TOKEN: ${MNEMOSYNE_MCP_TOKEN:-localdev-memory-token}
      # Host header values clients present: the compose service name and the
      # host mapping below. Anything else is refused.
      MNEMOSYNE_MCP_ALLOWED_HOSTS: "mnemosyne:8787,localhost:${MNEMOSYNE_PORT:-8787}"
      # Preserve immutable source record IDs and revisions. Extraction/review
      # now happens in the app; canonical sidecar facts are never injected.
      MNEMOSYNE_AUTO_SLEEP_ENABLED: "false"
      MNEMOSYNE_LLM_ENABLED: ${MNEMOSYNE_LLM_ENABLED:-false}
      MNEMOSYNE_LLM_BASE_URL: ${MNEMOSYNE_LLM_BASE_URL:-http://litellm:4000/v1}
      MNEMOSYNE_LLM_MODEL: ${MNEMOSYNE_LLM_MODEL:-haiku-4-5}
      MNEMOSYNE_LLM_API_KEY: ${MNEMOSYNE_LLM_API_KEY:-sk-litellm-local}
      MNEMOSYNE_LLM_CONFLICT_DETECTION: ${MNEMOSYNE_LLM_CONFLICT_DETECTION:-false}
      MNEMOSYNE_CONFLICT_LLM_BASE_URL: ${MNEMOSYNE_CONFLICT_LLM_BASE_URL:-http://litellm:4000/v1}
      MNEMOSYNE_CONFLICT_LLM_MODEL: ${MNEMOSYNE_CONFLICT_LLM_MODEL:-haiku-4-5}
      MNEMOSYNE_CONFLICT_LLM_API_KEY: ${MNEMOSYNE_CONFLICT_LLM_API_KEY:-sk-litellm-local}
      # Legacy manual sidecar tooling only; these do not approve app memories.
      MNEMOSYNE_SLEEP_MODEL_REFRESH_CATEGORIES: ${MNEMOSYNE_SLEEP_MODEL_REFRESH_CATEGORIES:-architecture,convention,techdebt}
      MNEMOSYNE_SLEEP_MODEL_REFRESH_CONFLICT_MIN_CONFIDENCE: ${MNEMOSYNE_SLEEP_MODEL_REFRESH_CONFLICT_MIN_CONFIDENCE:-0.8}
      MNEMOSYNE_SLEEP_MODEL_REFRESH_CONFLICT_MIN_EVIDENCE: ${MNEMOSYNE_SLEEP_MODEL_REFRESH_CONFLICT_MIN_EVIDENCE:-5}
    ports:
      - "${MNEMOSYNE_PORT:-8787}:8787"
    volumes:
      - mnemosyne-data:/data
    healthcheck:
      # Readiness = uvicorn is listening. A successful TCP connect exits 0; a
      # refused socket raises and exits non-zero. Simpler and more reliable than
      # a full MCP handshake for a liveness gate.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('localhost', 8787), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: multiplayer-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
      # Skips the master-password prompt on every launch.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the connection so the server is already in the tree.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  pgadmin-data:
  mnemosyne-data:
  repo-embedding-models:
  # Shared by the `web` and `worker` containers (the `app` profile), mounted at
  # /app/workspaces in both. This is the session git state — the durable record
  # — so unlike the presence Redis it must NOT be wiped casually.
  workspace_data:
# The schema is deliberately NOT applied through /docker-entrypoint-initdb.d.
# Running the migration files that way would create the tables without
# recording them in schema_migrations, so the next `npm run db:migrate` would
# try to create them again and fail. Run the migrations through the runner.
