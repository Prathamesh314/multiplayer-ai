# LiteLLM proxy config.
#
# The memory worker can use this OpenAI-compatible endpoint to ask Claude for
# evidence-backed fact/procedure proposals. Approval stays in the application.
#
# Set MEMORY_EXTRACTION_MODEL=haiku-4-5 on the worker; that
# alias maps here to the current fast Claude. `drop_params` discards
# OpenAI-only fields the sidecar might send that the Anthropic API would reject.
model_list:
  - model_name: haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
