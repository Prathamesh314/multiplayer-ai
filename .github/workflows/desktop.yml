name: Desktop checks and preview installers

on:
  pull_request:
    paths:
      - desktop/**
      - runner/**
      - app/lib/ai/**
      - app/lib/desktop.ts
      - app/components/ai/DevicesDialog.tsx
      - tests/desktop*
      - tests/runner-package.test.mjs
      - scripts/package-runner.mjs
      - tests/fixtures/desktop-runner.cjs
      - package*.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          # Ubuntu 24.04 restricts Electron's sandbox to apps with an AppArmor
          # profile: install the .deb (which brings one) and test that app.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            installed: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Audits what is shipped. The remaining high-severity advisory is braces,
      # reached only through eslint-config-next, with no patched release at any
      # version; npm's only "fix" is a major downgrade of the lint config. Drop
      # --omit=dev once braces publishes a fix.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run test:desktop
      - run: npm run test:runner-package
      # Claude Code and Codex installed with npm are `.cmd` launchers on Windows,
      # which Node will not start by name: a real npm install, started as the app does.
      - run: npm run test:agent-command:real
      - name: Development smoke test
        if: runner.os != 'Linux'
        run: npm run test:desktop:smoke
      # On Ubuntu 24.04 an Electron that is not installed with its AppArmor profile
      # cannot start its sandbox ("The SUID sandbox helper binary … is not
      # configured correctly"), so that job tests only the installed .deb.
      - name: Development smoke test (virtual display)
        if: runner.os == 'Linux' && !matrix.installed
        run: xvfb-run --auto-servernum npm run test:desktop:smoke
      - name: Build setup-screen preview installers
        run: npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }} --setup
      - name: Packaged smoke test
        if: runner.os != 'Linux'
        run: node tests/desktop-smoke.mjs --packaged
      - name: Packaged smoke test (virtual display)
        if: runner.os == 'Linux' && !matrix.installed
        run: xvfb-run --auto-servernum node tests/desktop-smoke.mjs --packaged
      # The website's one-command installers, run exactly as people run them, against
      # this build served locally with its published-style checksum file.
      - name: Serve this build like a release
        shell: bash
        run: |
          cat desktop-dist/SHA256SUMS-*.txt > desktop-dist/SHA256SUMS.txt
          cat desktop-dist/SHA256SUMS.txt
          # A start-if-needed script: the install steps call it too, since a
          # background process does not always outlive its step (macOS runners).
          cat > "$RUNNER_TEMP/serve-release.sh" <<'SERVE'
          url=http://127.0.0.1:8799/SHA256SUMS.txt
          if ! curl -sf "$url" >/dev/null 2>&1; then
            nohup python3 -m http.server 8799 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/desktop-dist" >> "$RUNNER_TEMP/release-server.log" 2>&1 &
            for _ in $(seq 1 30); do curl -sf "$url" >/dev/null 2>&1 && break; sleep 1; done
          fi
          curl -sf "$url" >/dev/null || { echo "::error::release server did not start"; cat "$RUNNER_TEMP/release-server.log"; exit 1; }
          SERVE
          bash "$RUNNER_TEMP/serve-release.sh"
      - name: Install with install.sh (the .deb on Ubuntu 24.04) and smoke-test the installed app
        if: matrix.installed == 'deb'
        run: |
          bash "$RUNNER_TEMP/serve-release.sh"
          sudo apt-get update -qq
          MULTICODE_DOWNLOAD_BASE=http://127.0.0.1:8799/ MULTICODE_NO_OPEN=1 sh public/install.sh linux
          dpkg -s multicode-ai-desktop >/dev/null 2>&1 || dpkg -l | grep -i multicode
          DESKTOP_SMOKE_EXECUTABLE="/opt/Multicode AI/multicode-ai" xvfb-run --auto-servernum node tests/desktop-smoke.mjs --packaged
      - name: Install with install.sh on macOS (no quarantine, so no Gatekeeper prompt)
        if: matrix.platform == 'mac'
        run: |
          bash "$RUNNER_TEMP/serve-release.sh"
          mkdir -p "$RUNNER_TEMP/Applications"
          MULTICODE_DOWNLOAD_BASE=http://127.0.0.1:8799/ MULTICODE_INSTALL_DIR="$RUNNER_TEMP/Applications" MULTICODE_NO_OPEN=1 sh public/install.sh mac-${{ matrix.arch }}
          app="$RUNNER_TEMP/Applications/Multicode AI.app"
          test -x "$app/Contents/MacOS/Multicode AI"
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then echo "::error::installed app is quarantined"; exit 1; fi
      - name: Install with install.ps1, as `irm … | iex` runs it
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $env:MULTICODE_DOWNLOAD_BASE = "http://127.0.0.1:8799/"
          $env:MULTICODE_NO_OPEN = "1"
          Get-Content -Raw public/install.ps1 | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Multicode AI\Multicode AI.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          Write-Host "Installed: $exe"
      # Manual runs (the installers you publish) are rebuilt with this website's
      # address built in, and signed when the credentials
      # are configured as repository secrets: macOS with a Developer ID certificate
      # and notarized by Apple, so it opens without "Apple could not verify";
      # Windows through Azure Trusted Signing or a code-signing certificate, so
      # SmartScreen names the publisher. Pull requests build unsigned previews.
      # Unset secrets arrive empty and are ignored (desktop/release-preflight.mjs).
      - name: Build the installers to publish
        if: github.event_name == 'workflow_dispatch' && !matrix.installed
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          fi
          npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          # Built in, so a new install opens straight to sign-in instead of asking for an address.
          DESKTOP_WORKSPACE_URL: ${{ vars.DESKTOP_WORKSPACE_URL || 'https://multicode.in' }}
          CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ github.event_name == 'workflow_dispatch' && matrix.platform == 'win' && vars.AZURE_TRUSTED_SIGNING_PUBLISHER || '' }}
      - name: Check the macOS app opens without a Gatekeeper warning
        if: matrix.platform == 'mac' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          app="$(node -p "require('./.desktop-build/output.json').executable.replace(/\/Contents\/MacOS\/.*$/, '')")"
          if codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::warning::macOS installer is not signed: add the Developer ID secrets (docs/desktop-signing.md) so it opens without 'Apple could not verify'."
          else
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          fi
      - uses: actions/upload-artifact@v7
        # The 24.04 job only proves the installed .deb runs; ubuntu-22.04 uploads Linux.
        if: '!matrix.installed'
        with:
          name: desktop-preview-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/*.deb
            desktop-dist/*.blockmap
            desktop-dist/SHA256SUMS-*.txt
