name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: multiplayer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: multiplayer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U multiplayer -d multiplayer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:architecture:postgres
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:desktop
      - run: npm run test:docker-context
      - run: npm run build -- --webpack
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
          CHROME_BIN: /usr/bin/google-chrome
