name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    concurrency:
      group: application-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: multiplayer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: multiplayer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U multiplayer -d multiplayer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:team-context
      - run: npm run test:team-context
        env:
          TEAM_CONTEXT_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:recovery
        env:
          RECOVERY_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: node --import tsx --test tests/signup-admission.test.mjs
        env:
          ADMISSION_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:architecture:postgres
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: node --import tsx --test tests/storage-admission.test.mjs
        env:
          STORAGE_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:sharing
        env:
          SHARING_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:collaboration
        env:
          COLLABORATION_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: node --import tsx tests/db-limits-postgres.mjs
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:clerk
        env:
          CLERK_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:desktop
      - run: node --import tsx --test tests/desktop-downloads.test.mjs
      - run: node --import tsx --test tests/return-path.test.mjs
      - run: npm run test:docker-context
      - run: node --test tests/production-deploy.test.mjs tests/deployment-safety.test.mjs
      - run: node --import tsx --test tests/cdn-config.test.mjs
      - run: npm run build -- --webpack
      - run: npm run test:signup:http
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:invitations:http
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:clerk:http
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:team-context:http
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:deployment
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
      - run: npm run test:ui
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:auth-ui
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:sharing:http
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
          CHROME_BIN: /usr/bin/google-chrome
      - run: node tests/marketing-downloads.browser.mjs --start-server
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:docs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:workspace-ui
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://multiplayer:test-only@localhost:5432/multiplayer_test
          CHROME_BIN: /usr/bin/google-chrome
      - name: Build production web image
        run: docker build -f docker/web/Dockerfile -t multiplayer-web:ci .
      - name: Verify production container runtime
        run: node tests/container-smoke.mjs
      - name: Build production worker image
        run: docker build -f docker/worker/Dockerfile -t multiplayer-worker:ci .
      - name: Verify worker storage bootstrap and maintenance commands
        run: node tests/worker-container-smoke.mjs
      - name: Verify encrypted backup and isolated restore
        run: npm run test:backup
        env:
          BACKUP_TEST_IMAGE: multiplayer-web:ci

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Never interrupt a release while it is backing up or migrating data.
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded revision $GITHUB_SHA; main is $latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy checked revision over restricted SSH
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          bundle="$RUNNER_TEMP/release.bundle"
          trap 'rm -f "$key" "$hosts" "$bundle"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          git bundle create "$bundle" HEAD
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$bundle"
          echo "Deployed $GITHUB_SHA to https://multicode.in after all application checks passed." >> "$GITHUB_STEP_SUMMARY"
